name: Build draft IG
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install tools
        run: |
          npm install -g fsh-sushi@3.15.0
          python -m pip install -r requirements.txt
          gem install jekyll -v 4.3.4 --no-document
      - name: Fetch pinned RuCore dependency
        run: python scripts/fetch_dependency.py
      - name: Build with HL7 Publisher
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-ig-and-qa
          path: |
            output/
            reports/
            sushi_output.txt
